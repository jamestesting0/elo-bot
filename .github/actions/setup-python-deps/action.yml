name: Set up Python dependencies
description: Install Python 3.12 and requirements.txt with uv, using CPU-only PyTorch wheels.

runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.12.10"
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install dependencies
      shell: bash
      env:
        # requirements.txt adds PyTorch indexes; let uv pick the best match across all indexes like pip does.
        UV_INDEX_STRATEGY: unsafe-best-match
      run: |
        # Runners have no GPU: swap the multi-GB CUDA wheels selected for x86_64 Linux for CPU builds.
        overrides="$RUNNER_TEMP/ci-overrides.txt"
        printf '%s\n' 'torch==2.7.1+cpu' 'torchvision==0.22.1+cpu' > "$overrides"
        uv pip install -r requirements.txt --overrides "$overrides"
